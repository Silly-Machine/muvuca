    <g class="o-feliz" fill="none" stroke="#1d1620" stroke-width="4.5" stroke-linecap="round"><path d="M61.5 71q6.5 -11.049999999999999 13 0"/><path d="M85.5 71q6.5 -11.049999999999999 13 0"/></g>
