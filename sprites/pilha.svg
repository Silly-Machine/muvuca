    <ellipse class="bochecha" cx="59.55" cy="80.35" rx="6.5" ry="3.9" fill="#ff7b96" opacity=".55"/><ellipse class="bochecha" cx="100.45" cy="80.35" rx="6.5" ry="3.9" fill="#ff7b96" opacity=".55"/>
