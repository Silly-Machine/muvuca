    <g class="rosto">
    <g class="o-normal"><g><ellipse cx="68" cy="68" rx="6.5" ry="8.125" fill="#1d1620"/><circle cx="70.275" cy="64.75" r="2.145" fill="#fff"/></g><g><ellipse cx="92" cy="68" rx="6.5" ry="8.125" fill="#1d1620"/><circle cx="94.275" cy="64.75" r="2.145" fill="#fff"/></g></g>
