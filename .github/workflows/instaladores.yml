name: Instaladores

# Gera os instaladores do aplicativo de mesa. Roda quando uma versão é marcada (tag "v1.2.3")
# ou à mão, pela aba Actions. Com tag, os arquivos vão para a página de Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: Windows, os: windows-latest, alvo: --win --x64 }
          - { nome: macOS, os: macos-latest, alvo: --mac --arm64 --x64 }
          - { nome: Linux, os: ubuntu-latest, alvo: --linux --x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test
      - name: Gerar instalador
        run: npx electron-builder ${{ matrix.alvo }} --publish never
        env:
          # Sem certificado de assinatura por enquanto: o sistema avisa na primeira abertura.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: muvuca-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar na página de Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Criar a versão com os instaladores
        run: gh release create "$TAG" arquivos/* --repo "$GITHUB_REPOSITORY" --title "Muvuca ${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
