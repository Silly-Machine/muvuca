name: Instaladores

# Gera os instaladores do aplicativo de mesa. Roda quando uma versão é marcada (tag "v1.2.3")
# ou à mão, pela aba Actions. Com tag, os arquivos vão para a página de Releases, com as notas
# tiradas do CHANGELOG.md, e a versão é publicada no npm. Como lançar: docs/versoes.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Duas publicações da mesma versão nunca correm juntas.
concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir a versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Com tag: ela tem de bater com o package.json. Sempre: a versão precisa de notas no CHANGELOG.
      - name: Tag, package.json e CHANGELOG batem?
        run: node scripts/versao.mjs conferir ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  instalador:
    name: ${{ matrix.nome }}
    needs: conferir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: Windows, os: windows-latest, alvo: --win --x64 }
          - { nome: macOS, os: macos-latest, alvo: --mac --arm64 --x64 }
          - { nome: Linux, os: ubuntu-latest, alvo: --linux --x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gerar instalador
        run: npx electron-builder ${{ matrix.alvo }} --publish never
        env:
          # Sem certificado de assinatura por enquanto: o sistema avisa na primeira abertura.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: muvuca-${{ matrix.nome }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar na página de Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: Somas de verificação
        working-directory: arquivos
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Notas da versão
        run: |
          VERSAO="${TAG#v}"
          {
            node scripts/versao.mjs notas "$VERSAO"
            cat .github/notas-de-instalacao.md
          } > notas.md
          cat notas.md
      - name: Publicar
        run: |
          OPCOES=()
          # versão com sufixo (1.0.0-beta.1) sai como pré-lançamento e não vira a "mais recente"
          case "$TAG" in *-*) OPCOES+=(--prerelease --latest=false) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # reexecução: troca os arquivos e as notas da versão que já existe
            gh release upload "$TAG" arquivos/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Muvuca ${TAG#v}" --notes-file notas.md
          else
            gh release create "$TAG" arquivos/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Muvuca ${TAG#v}" --notes-file notas.md "${OPCOES[@]}"
          fi

  # Publica a versão no npm, sem token guardado: o npm confia neste fluxo (publicação confiável, por OIDC).
  # O cadastro é feito uma vez em npmjs.com, no pacote: Settings > Trusted Publisher > GitHub Actions,
  # com Silly-Machine / muvuca / instaladores.yml. Não vale para execução à mão, por isso o "push".
  npm:
    name: Publicar no npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: instalador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sem "registry-url" de propósito: com ele, o setup-node põe um token de enfeite (NODE_AUTH_TOKEN) no
      # ambiente, e quando a troca de identidade falha o npm usa esse enfeite e responde um 404 enganoso
      # (foi o que aconteceu na v1.0.3). Sem ele, a falha aparece como falta de autenticação, que é o que ela é.
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # a publicação confiável pede npm 11.5.1 ou mais novo
      - name: Publicar, se a versão ainda não está lá
        run: |
          echo "npm $(npm --version)"
          VERSAO="${GITHUB_REF_NAME#v}"
          if npm view "muvuca@$VERSAO" version > /dev/null 2>&1; then
            echo "muvuca@$VERSAO já está no npm."
            exit 0
          fi
          # versão com sufixo (1.1.0-beta.1) vai com a etiqueta "next" e não vira a "latest"
          case "$VERSAO" in *-*) ETIQUETA=next ;; *) ETIQUETA=latest ;; esac
          npm publish --tag "$ETIQUETA"
