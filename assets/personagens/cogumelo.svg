    <g class="o-feliz" fill="none" stroke="#1d1620" stroke-width="4.5" stroke-linecap="round"><path d="M62.5 111q5.5 -9.35 11 0"/><path d="M86.5 111q5.5 -9.35 11 0"/></g>
