<svg xmlns="http://www.w3.org/2000/svg" class="mascote" data-estado="disponivel" width="320" height="340" viewBox="0 0 160 170" role="img" aria-label="Cogumelo (produto)">
    <style>
  .mascote * { transform-box:fill-box; transform-origin:center; }

  /* animações por parte do corpo */
  .corpo { animation:respirar 3.4s ease-in-out infinite; animation-delay:calc(var(--i) * -700ms); }
  .sombra { animation:sombra 3.4s ease-in-out infinite; animation-delay:calc(var(--i) * -700ms); }
  .o-normal { animation:piscar 5s infinite; animation-delay:calc(var(--i) * -1300ms); }
  .antena, .tufo { transform-origin:50% 100%; animation:balancar 2.8s ease-in-out infinite; }
  .led { animation:led 1.6s infinite; } .led:nth-of-type(2n) { animation-delay:.5s; } .led:nth-of-type(3n) { animation-delay:.9s; }
  .faceta-brilho { animation:brilho 3.6s ease-in-out infinite; }
  .giro { animation:girar 10s linear infinite; } [data-estado=trabalhando] .giro { animation-duration:2.4s; }
  @keyframes girar { to { transform:rotate(360deg); } }
  .pupila { animation:olhar 6s ease-in-out infinite; }
  @keyframes respirar { 50% { transform:translateY(-5px); } }
  @keyframes sombra { 50% { transform:scaleX(.88); opacity:.7; } }
  @keyframes piscar { 0%, 93%, 100% { transform:scaleY(1); } 96% { transform:scaleY(.08); } }
  @keyframes balancar { 0%, 100% { transform:rotate(-7deg); } 50% { transform:rotate(7deg); } }
  @keyframes led { 0%, 100% { opacity:.25; } 40% { opacity:1; } }
  @keyframes brilho { 0%, 100% { opacity:.15; } 50% { opacity:.6; } }
  @keyframes olhar { 0%, 30%, 100% { transform:translateX(0); } 40%, 55% { transform:translateX(-5px); } 65%, 85% { transform:translateX(5px); } }

  .o-foco, .o-feliz, .o-susto, .b-reta, .b-aberta, .bochecha, .notebook, .digitando, .alerta, .estrelas { display:none; }
  /* pensando: inclina, olha para cima, bolha de três pontos */
  [data-estado=pensando] .corpo { animation:pensar 1.6s ease-in-out infinite; }
  [data-estado=pensando] .o-normal { animation:none; transform:translateY(-3px); }
  [data-estado=pensando] .digitando { display:inline; }
  .digitando circle { animation:ponto 1.1s infinite; } .digitando circle:nth-of-type(2) { animation-delay:.18s; } .digitando circle:nth-of-type(3) { animation-delay:.36s; }
  @keyframes pensar { 0%, 100% { transform:rotate(-4deg) translateY(-2px); } 50% { transform:rotate(4deg) translateY(-6px); } }
  @keyframes ponto { 0%, 60%, 100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-3px); opacity:1; } }
  /* trabalhando: olhos de foco, notebook, mãos e pés batucando */
  [data-estado=trabalhando] .corpo { animation:digitar .32s ease-in-out infinite; }
  [data-estado=trabalhando] :is(.o-normal, .b-curva) { display:none; }
  [data-estado=trabalhando] :is(.o-foco, .b-reta, .notebook) { display:inline; }
  [data-estado=trabalhando] .mao-e { animation:tecla .22s ease-in-out infinite; } [data-estado=trabalhando] .mao-d { animation:tecla .22s ease-in-out -.11s infinite; }
  [data-estado=trabalhando] .pe-e { animation:tecla .44s ease-in-out infinite; } [data-estado=trabalhando] .pe-d { animation:tecla .44s ease-in-out -.22s infinite; }
  [data-estado=trabalhando] .led { animation-duration:.35s; } [data-estado=trabalhando] .pupila { animation-duration:1.2s; }
  .tela-linha { animation:codigo 1s steps(4) infinite; transform-origin:0 50%; } .tela-linha:nth-of-type(2n) { animation-delay:-.4s; }
  @keyframes digitar { 50% { transform:translateY(1.5px); } }
  @keyframes tecla { 50% { transform:translateY(-3px); } }
  @keyframes codigo { from { transform:scaleX(.2); } to { transform:scaleX(1); } }
  /* concluído: pulo, olhos felizes, bochechas, estrelinhas */
  [data-estado=concluido] .corpo { animation:pular .7s cubic-bezier(.3,1.6,.5,1) 2; }
  [data-estado=concluido] :is(.o-normal, .b-curva) { display:none; }
  [data-estado=concluido] :is(.o-feliz, .b-aberta, .bochecha, .estrelas) { display:inline; }
  .estrelas circle { animation:estourar .9s ease-out both; } .estrelas circle:nth-of-type(2) { animation-delay:.1s; } .estrelas circle:nth-of-type(3) { animation-delay:.2s; } .estrelas circle:nth-of-type(4) { animation-delay:.15s; }
  @keyframes pular { 40% { transform:translateY(-18px) scale(.97, 1.04); } 70% { transform:translateY(0) scale(1.04, .96); } }
  @keyframes estourar { from { transform:scale(0); opacity:1; } to { transform:scale(1.4) translateY(-14px); opacity:0; } }
  /* aguardando você: olhos arregalados, tremidinha, alerta */
  [data-estado=aguardando] .corpo { animation:tremer .28s linear infinite; }
  [data-estado=aguardando] :is(.o-normal, .b-curva) { display:none; }
  [data-estado=aguardando] :is(.o-susto, .b-reta, .alerta) { display:inline; }
  .alerta { animation:pular .8s ease-in-out infinite; }
  @keyframes tremer { 25% { transform:translateX(-1.5px); } 75% { transform:translateX(1.5px); } }
  @media (prefers-reduced-motion: reduce) { .mascote * { animation:none !important; transition:none !important; } }
</style>
