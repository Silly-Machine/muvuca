      <radialGradient id="g-livro" cx="34%" cy="26%" r="85%"><stop offset="0" stop-color="#ffaddd"/><stop offset=".55" stop-color="#ff7bc8"/><stop offset="1" stop-color="#9f4e86"/></radialGradient>
      <linearGradient id="g-livrol" x1="0" x2="1"><stop offset="0" stop-color="#ff7bc8"/><stop offset=".55" stop-color="#ff7bc8"/><stop offset="1" stop-color="#9f4e86"/></linearGradient>
