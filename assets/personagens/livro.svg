    <ellipse class="bochecha" cx="64.2" cy="93.4" rx="6" ry="3.5999999999999996" fill="#ff7b96" opacity=".55"/><ellipse class="bochecha" cx="105.8" cy="93.4" rx="6" ry="3.5999999999999996" fill="#ff7b96" opacity=".55"/>
