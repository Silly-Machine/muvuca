    <g class="o-feliz" fill="none" stroke="#1d1620" stroke-width="4.5" stroke-linecap="round"><path d="M58.2 89q5.8 -9.86 11.6 0"/><path d="M80.2 89q5.8 -9.86 11.6 0"/></g>
    <g class="o-susto"><circle cx="64" cy="86" r="7.83" fill="#fff"/><circle cx="64" cy="86" r="3.19" fill="#1d1620"/><circle cx="86" cy="86" r="7.83" fill="#fff"/><circle cx="86" cy="86" r="3.19" fill="#1d1620"/></g>
    <ellipse class="bochecha" cx="56.46" cy="97.02" rx="5.8" ry="3.48" fill="#ff7b96" opacity=".55"/><ellipse class="bochecha" cx="93.54" cy="97.02" rx="5.8" ry="3.48" fill="#ff7b96" opacity=".55"/>
