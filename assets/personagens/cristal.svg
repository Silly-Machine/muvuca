  </g></g>
    <circle class="mao-e" cx="30" cy="104" r="7.5" fill="#ffde91"/><circle class="mao-d" cx="130" cy="104" r="7.5" fill="#ffde91"/>
      <g class="notebook"><path d="M50 150h60l5 9h-70z" fill="#cfcbe0"/><rect x="54" y="122" width="52" height="30" rx="4" fill="#2a2638"/><rect x="58" y="126" width="44" height="22" rx="2" fill="#16131f"/>
        <rect class="tela-linha" x="62" y="130" width="30" height="2.5" rx="1" fill="#ffde91"/><rect class="tela-linha" x="62" y="136" width="22" height="2.5" rx="1" fill="#63e6a3"/><rect class="tela-linha" x="62" y="142" width="34" height="2.5" rx="1" fill="#ffd27a"/></g>
