    <ellipse class="bochecha" cx="58.55" cy="100.35" rx="6.5" ry="3.9" fill="#ff7b96" opacity=".55"/><ellipse class="bochecha" cx="101.45" cy="100.35" rx="6.5" ry="3.9" fill="#ff7b96" opacity=".55"/>
