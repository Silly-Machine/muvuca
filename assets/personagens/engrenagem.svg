      <linearGradient id="g-engrenageml" x1="0" x2="1"><stop offset="0" stop-color="#4fb3ff"/><stop offset=".55" stop-color="#4fb3ff"/><stop offset="1" stop-color="#396ea6"/></linearGradient>
